<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trò Chơi Kinh Dị - Hiển Thị Ảnh Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #050505;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 800px;
      max-height: 600px;
      border: 2px solid #333;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
      background-color: #0a0a0a;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* Để mờ đủ thấy rõ tệp ảnh mắt phía sau */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 32px;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 25px #8b0000;
      margin-bottom: 20px;
      letter-spacing: 2px;
      animation: pulse 2s infinite;
    }

    .subtitle {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 30px;
      line-height: 1.5;
      text-shadow: 0 0 5px #000;
    }

    .btn {
      padding: 12px 30px;
      font-size: 16px;
      font-family: inherit;
      color: #fff;
      background: #8b0000;
      border: 2px solid #ff0000;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn:hover, .btn:active {
      background: #ff0000;
      box-shadow: 0 0 20px #ff0000;
      transform: scale(1.05);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 10px #ff0000, 0 0 25px #8b0000; }
      50% { opacity: 0.7; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
    }

    .hidden {
      display: none !important;
    }

    /* Joystick Cảm Ứng */
    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 5;
      display: none;
    }

    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: rgba(255, 0, 0, 0.6);
      border: 2px solid #ff0000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ff0000;
    }

    /* Thông báo Trạng thái Kỹ năng */
    #skill-status {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: #ff0000;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 0 0 8px #ff0000, 0 0 15px #8b0000;
      pointer-events: none;
      z-index: 6;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="skill-status"></div>

    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>

    <!-- Menu Screen -->
    <div id="menuScreen" class="overlay">
      <h1 class="title">BÓNG TỐI HUYẾT NGỤC</h1>
      <p class="subtitle">
        PC: <b>WASD</b> / <b>Mũi tên</b> | Mobile: <b>Joystick</b><br><br>
        🩸 <b>KỸ NĂNG QUÁI VẬT:</b><br>
        Bóng tối bao quanh sẽ bị nhuộm <b>MÀU ĐỎ RỰC</b> ngẫu nhiên!<br><br>
        Nhặt <b>Chìa khóa</b> vàng và chạy tới <b>Cửa thoát</b>.
      </p>
      <button id="startBtn" class="btn">BẮT ĐẦU CHƠI</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="title" style="color: #ff0000;">BẠN ĐÃ CHẾT!</h1>
      <p class="subtitle">Quái vật đã bắt được bạn trong bóng tối...</p>
      <button id="restartBtn" class="btn">THỬ LẠI</button>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" class="overlay hidden">
      <h1 class="title" style="color: #00ffcc;">THOÁT NẠN!</h1>
      <p class="subtitle">Bạn đã sống sót thành công!</p>
      <button id="winRestartBtn" class="btn">CHƠI LẠI</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const menuScreen = document.getElementById('menuScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const winScreen = document.getElementById('winScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const winRestartBtn = document.getElementById('winRestartBtn');
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const skillStatus = document.getElementById('skill-status');

    // Nạp ảnh gốc của bạn dưới dạng dữ liệu
    const menuBgImage = new Image();
    let isImageLoaded = false;
    
    // Tệp ảnh bạn cung cấp đã được mã hóa vào đây
    menuBgImage.src = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1E19/f3933/8z//////zp/333/8//2wBDASERGhgWGTYjIzyWUlBSlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlp/wAARCAEgAYADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJEAQURIQAEMQFRBhCi0VJTgwfx8BF34SYW4RJC0jRFRk/y1fP0+MHC0eXp7m5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/9oADAMBAf28A/M3P0r0/s/f5/eX59/s8/i7d/eX5/wD8/S/6f59/m350f55/y0f156d959f7P5fP6/L9Of9+b6/vP8A31f0v0/8/L31z/y8v8+/t6e4/95f/x4f9f731111/X69P8/s+/y32f48123zX6+p09/3P39X6e/p1/f31f99v0f15/eX6/wB5d/l2/wA8+l/l/m/15v0898++3+f55+X2+vf/EACERAQEAAgIDAQEBAQEAAAAAAAAAAQITESEwQVFxYYECQv/aAAw2gA0A33+5+/s8/f7P/S19/94v8++32eX5v1/19/335f993f/f58++eX36d/3L0//s++/S299/6/53e1f5/l6d30++efX8993f4/9b5f4/19/vf18fS3e1f5/1531e2+vv+d113f8+e/2d3/A9/89u2eX5evX0899f193f4/8fS/15/8/f0e/X16vX3e3+P/aAAwDAQACE me/f/v33f9/1+72ff3e23f038++X5eX+vv9/e1e12/3/x4v/ANfX7/2+ffb/AEe/0++e9e1e3+3Xvf8A38/3Xvf/AH8ff8+ee+e+3f4/8f8Af383b+3e/wD0/fX/X111+e++/S299ff/AHX013vf18eX6e91113+Pf9n3+vf4/3+/wBfv8+e++/32++X35v6/S3f0393/vf9f14v8++328ffs/Pvf/3/v35+/08fX2e++/9f0//A28/f3vX/f3+efl2+X3e/b39/8Af0f991f8+/X613ev0++e9e/s/f3/AH/AOfs/vP/f/9f9e1569vf31++vv/f/f8APe++/94/d+2ff5/mff/ff5++/08f5/8Av69P/s++e/f/AL+/5++e3b+fff1fX+/2++/31++ef1132+/p1+/ff57+e/vf5f532/XvffX6e+/33/35vv3/AH5/e++X11v8e++l+/t239++/tffX0e9329+/X9P399ff231+vf/AOf++/8Affv238/v3/v++fe3+n2e+/s931f0/f8A/X3+/n7+3+/v3ff4/v8Af/P613ff16ev0v8Af/8A31/X3vvvvvf+v8/Xf3e++/8Aev8/L2e223bf06e23+d3Xbf9f539fb0/35+/ffv+ffs9f2/X/e/2++e/v++/39/0f33e/t/vfffX1/f+ffe+f1ff9n3/v/f+/m+mffX17+/Tvvv6vv7/AH9v7+/X27+/0+152ff2vv3+vf3/AL9vv/3+/v1+2f1+ffv6e2+22++/369vb/XvffXbf5ev+vf4e2/0evvf4d3/AH8f4ff/AOf1ff099+/bf89++X32++/vfffv/ffS+91/3+e/fe2ff++/3571ff7/AH++/vvf4d99e/S+X6//AH33bf593bf4ff23v76f3f019/vf1e/S/f5eX/v9fv++/T1+d/s++/S+fS19v/2Q==';

    menuBgImage.onload = function() {
      isImageLoaded = true;
    };

    const keys = {};
    let joystickVector = { x: 0, y: 0 };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Joystick Cảm ứng
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };
    const maxRadius = 35;

    joystickZone.addEventListener('touchstart', e => {
      e.preventDefault();
      joystickActive = true;
      const rect = joystickZone.getBoundingClientRect();
      joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystick(e.touches[0]);
    });

    window.addEventListener('touchmove', e => {
      if (joystickActive) updateJoystick(e.touches[0]);
    });

    window.addEventListener('touchend', e => {
      if (joystickActive) {
        joystickActive = false;
        joystickVector = { x: 0, y: 0 };
        joystickKnob.style.transform = `translate(-50%, -50%)`;
      }
    });

    function updateJoystick(touch) {
      let dx = touch.clientX - joystickCenter.x;
      let dy = touch.clientY - joystickCenter.y;
      let distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joystickVector = { x: dx / maxRadius, y: dy / maxRadius };
    }

    let pulseTimer = 0; // Biến tạo nhấp nháy cho mắt đỏ trên bức ảnh

    function drawMenuBackground() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isImageLoaded) {
        // Vẽ bức ảnh mắt đỏ của bạn làm nền Menu
        ctx.drawImage(menuBgImage, 0, 0, canvas.width, canvas.height);

        // Thêm lớp hiệu ứng nhấp nháy đỏ ma mị phủ lên bức ảnh
        pulseTimer += 0.05;
        let glowAlpha = 0.15 + Math.sin(pulseTimer) * 0.12; 

        ctx.fillStyle = `rgba(255, 0, 0, ${glowAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    let player, npc, keyItem, exitDoor, gameState;
    let cooldownTimer = 0;
    let skillActiveTimer = 0;
    let isRedSkillActive = false;

    function initGame() {
      gameState = 'PLAYING';

      player = { x: 100, y: 100, radius: 12, speed: 2.8, hasKey: false };
      
      npc = {
        x: 700,
        y: 500,
        radius: 15,
        speed: 1.9
      };

      keyItem = { x: 700, y: 100, radius: 8, collected: false };
      exitDoor = { x: 50, y: 500, width: 30, height: 50 };

      cooldownTimer = Math.floor(120 + Math.random() * 180); 
      skillActiveTimer = 0;
      isRedSkillActive = false;

      menuScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      winScreen.classList.add('hidden');
      joystickZone.style.display = 'block';
      skillStatus.innerText = '';
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      // 1. Di chuyển Player
      let moveX = joystickVector.x;
      let moveY = joystickVector.y;

      if (keys['w'] || keys['arrowup']) moveY = -1;
      if (keys['s'] || keys['arrowdown']) moveY = 1;
      if (keys['a'] || keys['arrowleft']) moveX = -1;
      if (keys['d'] || keys['arrowright']) moveX = 1;

      if (moveX !== 0 && moveY !== 0 && !joystickActive) {
        moveX *= 0.7071;
        moveY *= 0.7071;
      }

      player.x += moveX * player.speed;
      player.y += moveY * player.speed;
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // 2. Quái vật đuổi theo
      const dx = player.x - npc.x;
      const dy = player.y - npc.y;
      const distance = Math.hypot(dx, dy);

      if (distance > 0) {
        npc.x += (dx / distance) * npc.speed;
        npc.y += (dy / distance) * npc.speed;
      }

      // 3. Logic Kỹ năng BÓNG TỐI HÓA ĐỎ Ngẫu Nhiên
      if (!isRedSkillActive) {
        cooldownTimer--;
        const secondsLeft = Math.ceil(cooldownTimer / 60);
        skillStatus.innerText = `⏳ Đang ẩn náu trong bóng tối (${secondsLeft}s)...`;

        if (cooldownTimer <= 0) {
          isRedSkillActive = true;
          skillActiveTimer = Math.floor(180 + Math.random() * 300); 
        }
      } else {
        skillActiveTimer--;
        const activeSecondsLeft = Math.ceil(skillActiveTimer / 60);
        skillStatus.innerText = `🩸 KĨ NĂNG: BÓNG TỐI HÓA ĐỎ! (${activeSecondsLeft}s)`;

        if (skillActiveTimer <= 0) {
          isRedSkillActive = false;
          cooldownTimer = Math.floor(240 + Math.random() * 360); 
        }
      }

      // 4. Va chạm
      if (!player.hasKey) {
        const distToKey = Math.hypot(player.x - keyItem.x, player.y - keyItem.y);
        if (distToKey < player.radius + keyItem.radius) {
          player.hasKey = true;
          keyItem.collected = true;
        }
      }

      if (distance < player.radius + npc.radius) {
        endGame(gameOverScreen);
      }

      if (player.hasKey &&
          player.x > exitDoor.x && player.x < exitDoor.x + exitDoor.width &&
          player.y > exitDoor.y && player.y < exitDoor.y + exitDoor.height) {
        endGame(winScreen);
      }
    }

    function endGame(screen) {
      gameState = 'ENDED';
      screen.classList.remove('hidden');
      joystickZone.style.display = 'none';
      skillStatus.innerText = '';
    }

    // Vẽ Game
    function draw() {
      // Nếu ở Màn hình Menu -> Hiển thị bức ảnh mắt đỏ gốc của bạn
      if (gameState === 'MENU') {
        drawMenuBackground();
        return;
      }

      // Sàn nhà bên dưới
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Đường lưới bản đồ
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Cửa thoát
      ctx.fillStyle = player.hasKey ? '#00ff88' : '#444';
      ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.width, exitDoor.height);

      // Chìa khóa
      if (!keyItem.collected) {
        ctx.beginPath();
        ctx.arc(keyItem.x, keyItem.y, keyItem.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#4da6ff';
      ctx.fill();

      // Mắt player
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x - 3, player.y - 3, 2, 0, Math.PI * 2);
      ctx.arc(player.x + 3, player.y - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Quái vật
      ctx.beginPath();
      ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#cc0000';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Mắt quái vật
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(npc.x - 4, npc.y - 3, 2, 0, Math.PI * 2);
      ctx.arc(npc.x + 4, npc.y - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // --- HIỆU ỨNG LỚP BÓNG TỐI / HUYẾT NGỤC ---
      const gradient = ctx.createRadialGradient(
        player.x, player.y, 20,
        player.x, player.y, 170
      );

      if (isRedSkillActive) {
        gradient.addColorStop(0, 'rgba(255, 0, 0, 0)');          
        gradient.addColorStop(0.5, 'rgba(180, 0, 0, 0.7)');       
        gradient.addColorStop(1, 'rgba(100, 0, 0, 0.98)');       
      } else {
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');            
        gradient.addColorStop(0.7, 'rgba(0, 0, 0, 0.85)');      
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.98)');        
      }

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);
    winRestartBtn.addEventListener('click', initGame);

    gameState = 'MENU';
    gameLoop();
  </script>
</body>
</html>
